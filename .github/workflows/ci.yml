# Host build, unit tests and clang-format check for every pull request (DEV #9).
# The job name `build-and-test` is the required status check on `main`.
# Actions are pinned to a commit SHA (a tag can be moved); the comment names the release.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang
          clang++ --version
          cmake --version

      # Same clang-format release as locally: formatting differs between major versions,
      # so the distribution's clang-format would report false failures. The runner image
      # sets its own PIPX_BIN_DIR, so install into a known directory and pass the exact
      # path to CMake (PATH may also contain an older clang-format).
      - name: Install clang-format 21.1.8
        env:
          PIPX_BIN_DIR: ${{ runner.temp }}/pipx_bin
        run: |
          pipx install clang-format==21.1.8
          "$PIPX_BIN_DIR/clang-format" --version
          echo "CLANG_FORMAT_EXE=$PIPX_BIN_DIR/clang-format" >> "$GITHUB_ENV"

      # GoogleTest is fetched by CMake (pinned release with SHA256, see tests/CMakeLists.txt).
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++
          -DCLANG_FORMAT_EXE="$CLANG_FORMAT_EXE"

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Unit tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Format check
        run: cmake --build build --target format-check
